<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maamulka - GURMAD NETWORK</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .box { max-width: 500px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #0b3d91; text-align: center; }
    input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #0b3d91; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #06265c; }
    .hidden { display: none; }
    .logout-btn { background-color: #d9534f; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Qaybta Galitaanka (Login) -->
  <div class="box" id="login-box">
    <h2>Galitaanka Maamulka (Admin)</h2>
    <input type="email" id="admin-email" placeholder="Geli Email-kaaga" required>
    <input type="password" id="admin-password" placeholder="Geli Password-kaaga" required>
    <button onclick="loginAdmin()">Soo Gal</button>
    <p id="error-msg" style="color: red; text-align: center;"></p>
  </div>

  <!-- Qaybta Dashboard-ka Maamulka -->
  <div class="box hidden" id="dashboard-box">
    <h2>Admin Dashboard - Gurmad Network</h2>
    <p>Ku soo dhawaada qaybta maamulka rasmiga ah.</p>
    
    <label><strong>Dooro Qaybta:</strong></label>
    <select id="category">
      <option value="news">Warar iyo Warbixino</option>
      <option value="media">GURMAD MEDIA</option>
      <option value="humanitarian">GURMAD HUMANITARIAN</option>
    </select>

    <input type="text" id="post-title" placeholder="Cinwaanka Warka / Qoraalka">
    <textarea id="post-content" rows="4" placeholder="Faahfaahinta warka halkan ku qor..."></textarea>
    
    <label><strong>Soo Geli Sawir ama Muuqaal:</strong></label>
    <input type="file" id="media-file" accept="image/*,video/*">

    <button onclick="publishPost()">Daabac Hadda (Publish)</button>
    <button class="logout-btn" onclick="logoutAdmin()">Ka Bax (Logout)</button>
  </div>

  <script>
    function loginAdmin() {
      alert("Waxaan hadda ku xidhaynaa Firebase si Email-kaaga iyo Password-kaagu u shaqeeyaan!");
    }
    function publishPost() {
      alert("Waxaa la sugayaa ku xidhida kaydka xogta (Firebase) si wararku toos ugu dhacaan bogga!");
    }
  </script>

</body>
</html>
